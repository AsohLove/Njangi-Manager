<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="512" height="512" rx="112" fill="#065f46"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- Open book: two pages meeting at a center spine -->
  <g>
    <!-- Left page -->
    <path d="M 256 168
             C 200 148, 140 148, 96 166
             L 96 348
             C 140 330, 200 330, 256 350
             Z"
          fill="#fbbf24"/>
    <!-- Right page -->
    <path d="M 256 168
             C 312 148, 372 148, 416 166
             L 416 348
             C 372 330, 312 330, 256 350
             Z"
          fill="#fbbf24"/>
    <!-- Spine shadow -->
    <path d="M 256 168 L 256 350" stroke="#b45309" stroke-width="4" opacity="0.4"/>

    <!-- Page lines, left -->
    <g stroke="#065f46" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <path d="M 122 196 C 160 186, 200 186, 234 198" fill="none"/>
      <path d="M 122 224 C 160 214, 200 214, 234 226" fill="none"/>
      <path d="M 122 252 C 160 242, 200 242, 234 254" fill="none"/>
    </g>
    <!-- Page lines, right -->
    <g stroke="#065f46" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <path d="M 278 198 C 312 186, 352 186, 390 196" fill="none"/>
      <path d="M 278 226 C 312 214, 352 214, 390 224" fill="none"/>
      <path d="M 278 254 C 312 242, 352 242, 390 252" fill="none"/>
    </g>
  </g>

  <!-- Dollar coin rising above the book's spine -->
  <circle cx="256" cy="140" r="58" fill="#fbbf24" stroke="#065f46" stroke-width="6"/>
  <text x="256" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#065f46" text-anchor="middle">$</text>

  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
</svg>
