name: Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: njangi_manager

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/njangi_manager

      - name: Run database migrations
        run: npx prisma migrate deploy --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/njangi_manager

      - name: Create E2E environment file
        run: |
          printf 'DATABASE_URL=postgresql://postgres:postgres@localhost:5432/njangi_manager\n' > .env.test

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Build backend
        run: npm run build